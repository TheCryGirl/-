# 在线商城 - 本地一键启动
#
# 用法：
#   docker compose up -d --build    打包并启动全部
#   docker compose up -d nacos mysql   只启动基础设施
#   docker compose logs -f gateway     看某个服务的日志
#   docker compose down                停止并移除容器
#
# 说明：
#   业务服务直接用 eclipse-temurin 跑 jar，不写 Dockerfile。
#   每个服务挂载 `../<服务>/target/<服务>-1.0.0-SNAPSHOT.jar` 为 `/app/app.jar`，
#   因此启动前必须先在该服务目录执行 `mvn -DskipTests package`，否则会报找不到 jar。
#   本项目当前不使用 Redis，未编排 redis 服务。

services:
  # ---------------- 基础设施 ----------------

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: mall-nacos
    environment:
      MODE: standalone
      # 开发期关闭鉴权，生产必须打开
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"   # 控制台与 OpenAPI
      - "9848:9848"   # gRPC
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 相对本文件所在目录（src/docker/），因此是 ./init-db.sql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ---------------- 微服务 ----------------
  # 下面每个服务都依赖基础设施就绪后才启动。
  # 服务间内部调用统一带 X-Internal-Token，INTERNAL_TOKEN 必须全栈一致，否则内部接口返回 10003。

  gateway:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-gateway
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-in-production-0123456789}
      TZ: Asia/Shanghai
    volumes:
      - ../gateway/target/gateway-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "9000:9000"
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-user
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-please-change-in-production-0123456789}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      # 初始管理员：注册接口只创建 BUYER，没有管理员就无法审核商品、开通卖家角色，
      # 一键部署后系统实际上不可用。这两个变量不配置时 AdminBootstrap 会跳过，
      # 不会写入任何默认口令。
      ADMIN_BOOTSTRAP_ACCOUNT: ${ADMIN_BOOTSTRAP_ACCOUNT:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      TZ: Asia/Shanghai
    volumes:
      - ../user-service/target/user-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      - user-uploads:/app/uploads
    ports:
      - "9001:9001"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-product
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes:
      - ../product-service/target/product-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
      - product-uploads:/app/uploads
    ports:
      - "9002:9002"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  cart-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-cart
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - ../cart-service/target/cart-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "9003:9003"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  order-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-order
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      ORDER_TIMEOUT_MINUTES: ${ORDER_TIMEOUT_MINUTES:-30}
      TZ: Asia/Shanghai
    volumes:
      - ../order-service/target/order-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "9004:9004"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    image: eclipse-temurin:17-jre-alpine
    container_name: mall-payment
    working_dir: /app
    command: ["java", "-jar", "app.jar"]
    environment:
      NACOS_ADDR: nacos:8848
      DB_HOST: mysql
      DB_PASSWORD: ${DB_PASSWORD:-123456}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
      MOCK_SECRET: ${MOCK_SECRET:-mock-pay-secret}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL:-}
      AUDIT_ENABLED: ${AUDIT_ENABLED:-true}
      TZ: Asia/Shanghai
    volumes:
      - ../payment-service/target/payment-service-1.0.0-SNAPSHOT.jar:/app/app.jar:ro
    ports:
      - "9005:9005"
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nacos-data:
  nacos-logs:
  mysql-data:
  product-uploads:
  user-uploads:

spring:
  datasource:
    url: jdbc:h2:mem:mall_order;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 20
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8
  cloud:
    nacos:
      discovery:
        enabled: false
        fail-fast: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.order.entity
  configuration:
    map-underscore-to-camel-case: true

services:
  product-url: http://127.0.0.1:1
  cart-url: http://127.0.0.1:1
  user-url: http://127.0.0.1:1

order:
  internal-token: test-internal-token
  timeout:
    minutes: 30
  compensation:
    max-retry: 3
  jobs:
    enabled: false

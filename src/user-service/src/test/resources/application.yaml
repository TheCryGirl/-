spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql

  cloud:
    nacos:
      discovery:
        enabled: false

jwt:
  secret: test-secret-please-change-in-production-0123456789
  expiration-hours: 1

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园二手交易平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>

             .chat-messages {
                      height: 300px;
                      overflow-y: auto;
                  }
                  .message-bubble {
                      max-width: 80%;
                      padding: 8px 12px;
                      border-radius: 12px;
                      margin-bottom: 8px;
                  }
                  .message-user {
                      background-color: #3b82f6;
                      color: white;
                      align-self: flex-end;
                      margin-left: auto;
                  }
                  .message-ai {
                      background-color: #f3f4f6;
                      color: black;
                      align-self: flex-start;
                  }
                  .chat-messages::-webkit-scrollbar {
                      width: 6px;
                  }
                  .chat-messages::-webkit-scrollbar-thumb {
                      background-color: #cbd5e1;
                      border-radius: 3px;
                  }
          .search-container {
              display: flex;
              justify-content: flex-start;
              align-items: center;
              width: 70%;
              padding: 10px 0;
              flex-grow: 1;
              margin-left: 20px;
          }

          .search-input {
              width: 650px;
              padding: 12px 15px;
              border: 1px solid #ccc;
              border-right: none;
              border-radius: 20px 0 0 20px;
              outline: none;
              font-size: 16px;
          }

          .search-button {
              padding: 10px 20px;
              background-color: #38f;
              color: white;
              border: none;
              border-radius: 0 20px 20px 0;
              cursor: pointer;
              font-size: 16px;
          }

          .search-button:hover {
              background-color: #152a66;
          }
    #message-badge {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: red;
        color: white;
        border-radius: 50%;
        padding: 2px 6px;
        font-size: 12px;
        display: none;
    }
#avatar-message-badge {
    position: absolute;
    top: -8px;
    right: -8px;
    background-color: red;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 10px;
    width: 18px;
    height: 18px;
    line-height: 14px;
    text-align: center;
}

    </style>
</head>
<body class="bg-gray-100">

    <!-- Top Navbar -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <i class="fas fa-store text-blue-600 text-2xl"></i>
                    <span class="font-bold text-xl text-gray-800 ml-2">校园易</span>
                </div>
                <div class="flex items-center">
                    <div class="search-container">
                        <input type="text" id="searchInput" class="search-input" placeholder="请输入搜索内容">

                    </div>
                    <div id="authButtons" class="ml-4 flex items-center">
                        <button onclick="showLoginModal()" class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-md text-sm font-medium">登录</button>
                        <button onclick="showRegisterModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md text-sm font-medium transition">注册</button>
                    </div>
                    <div id="userInfo" class="hidden ml-4 relative">
                        <button onclick="toggleProfileMenu()" class="flex items-center space-x-2 relative">

                            <div id="avatar-message-badge" class="absolute top-0 right-0 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">1</div>
                        </button>
                        <div id="profileMenu" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg py-1 z-50">
                            <a href="#" onclick="loadMyProducts()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">我发布的</a>
                            <a href="#" onclick="loadMyOrders('buy')" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">我买到的</a>
                            <a href="#" onclick="loadMyOrders('sell')" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">我卖出的</a>
                            <a href="#" onclick="loadMyMessagesList()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 relative">

                            </a>
                            <a href="#" onclick="logout()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">退出登录</a>
                        </div>
                    </div>

            </div>

    </nav>

    <!-- Banner -->

            <p class="mt-2 text-lg text-blue-100">一个专为在校师生打造的二手交易平台</p>
            <button onclick="showSellModal()" class="mt-6 bg-white text-blue-600 font-bold py-2 px-6 rounded-full hover:bg-blue-50 transition hidden" id="sellBtn">
                <i class="fas fa-plus mr-2"></i>发布我的闲置

    <div class="flex flex-1 overflow-hidden">

                    <div class="space-y-3">

                <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">商品分类</h3>

                    <a href="#" onclick="loadProducts('electronics')" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md">
                        <i class="fas fa-laptop mr-3 text-gray-400 group-hover:text-gray-500"></i> 数码电子

                    <a href="#" onclick="loadProducts('books')" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md">

                    <a href="#" onclick="loadProducts('sports')" class="text-gray-600 hover:bg-gray-50 hover:text-gray-900 group flex items-center px-2 py-2 text-sm font-medium rounded-md">

    <script>
        // 全局 Fetch 封装，自动添加 Token 并处理 401
        function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('token');
            if (!options.headers) {
                options.headers = {};
            }
            // 如果是 Headers 对象（虽然这里大部分是用普通对象），需要做兼容，这里假设都是普通对象
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }

            return fetch(url, options).then(response => {
                if (response.status === 401) {
                    console.warn('Unauthorized access, logging out...');
                    // 不刷新页面，仅清理状态并弹窗
                    logout(false);
                    alert('登录已过期，请重新登录');
                    showLoginModal();
                    // 抛出错误中断后续处理
                    throw new Error('未授权，请重新登录');
                }
                return response;
            });
        }

        let currentUser = null;
        let conversationId = null;
        let currentPriceMin = null;
        let currentPriceMax = null;

async function searchProducts(searchTerm) {
    currentSearchKeyword = searchTerm;
    const productsGrid = document.getElementById('productsGrid');
    productsGrid.innerHTML = '<div class="col-span-full text-center py-10"><i class="fas fa-spinner fa-spin text-3xl text-gray-300"></i></div>';

    try {
        const response = await fetchWithAuth(`/api/products/search?keyword=${encodeURIComponent(searchTerm)}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const products = await response.json();

        if (products.length === 0) {
            productsGrid.innerHTML = '<div class="col-span-full text-center text-gray-500 py-10">没有找到相关商品</div>';
            return;
        }

        allProductsCache = [...products];
        let filteredProducts = applyCurrentPriceFilter(products);
        filteredProducts = sortProducts(filteredProducts);
        updateProductList(filteredProducts);
    } catch (error) {
        console.error('搜索商品时发生错误:', error);
        productsGrid.innerHTML = '<div class="col-span-full text-center text-red-500 py-10">搜索失败，请重试</div>';
    }
}
function sortProducts(products) {
    switch(currentSortOption) {
        case 'time':
            return products.sort((a, b) => new Date(b.createTime) - new Date(a.createTime));
        case 'price':
            return products.sort((a, b) => parseFloat(a.price) - parseFloat(b.price));
        case 'default':
        default:
            return products;
    }
}

        let lastMessageCount = 0;
        let isPollingPaused = false;
        
        async function loadUserChatHistory() {
            if (!currentUser || !currentChatTargetId || isPollingPaused) return;
            
            try {
                const response = await fetchWithAuth(`/api/messages/conversation?userId1=${currentUser.userId}&userId2=${currentChatTargetId}`);
                if (response.ok) {
                    const messages = await response.json();
                    
                    if (messages.length !== lastMessageCount) {
                        const container = document.getElementById('userChatMessages');
                        container.innerHTML = '';
                        
                        messages.forEach(msg => {
                            const div = document.createElement('div');
                            div.className = 'flex flex-col space-y-2';
                            const isMe = msg.senderId === currentUser.userId;
                            const bubbleClass = isMe ? 'message-user' : 'message-ai'; // Reuse styles
                            
                            div.innerHTML = `<div class="message-bubble ${bubbleClass}">${msg.content}</div>`;
                            container.appendChild(div);
                            if (!isMe && !msg.isRead) {
                                pendingReadMessages.push(msg.id);
                            }
                        });
                        container.scrollTop = container.scrollHeight;
                        lastMessageCount = messages.length;
                    }
                    
                    if (pendingReadMessages.length > 0) {
                        await markMessagesAsReadBatch(pendingReadMessages);
                        pendingReadMessages = [];
                    }
                }
            } catch (e) {
                console.error('加载聊天历史失败:', e);
                isPollingPaused = true;
                setTimeout(() => { isPollingPaused = false; }, 3000);
            }
        }

            </div>
        `;

    // Update Pagination Controls

    }
}

        async function streamChat(msg, onChunk, onError) {
             if (!conversationId) {
                 if (onError) onError("请先登录");
                 return;
             }
             try {
                const response = await fetchWithAuth(`/ai/chat?conversationId=${conversationId}&message=${encodeURIComponent(msg)}`);
                if (!response.ok) {
                    if (onError) onError("请求失败");
                    return;
                }
                const fullText = await response.text();
                if (!fullText) {
                    if (onError) onError("无回复");
                    return;
                }
                let index = 0;
                await new Promise(resolve => {
                    const timer = setInterval(() => {
                        onChunk(fullText.charAt(index));
                        index += 1;
                        if (index >= fullText.length) {
                            clearInterval(timer);
                            resolve();
                        }
                    }, 20);
                });
            } catch (e) {
                console.error(e);
                if (onError) onError("网络错误");
            }
        }

// 价格筛选函数
function applyCurrentPriceFilter(products) {
    if ((currentPriceMin !== null && currentPriceMin !== '') || (currentPriceMax !== null && currentPriceMax !== '')) {
        return products.filter(product => {
            const price = parseFloat(product.price);
            const min = currentPriceMin !== null && currentPriceMin !== '' ? parseFloat(currentPriceMin) : 0;
            const max = currentPriceMax !== null && currentPriceMax !== '' ? parseFloat(currentPriceMax) : Infinity;

            return price >= min && price <= max;
        });
    }
    return products;
}
function applyPriceFilter() {
    const minPrice = document.getElementById('minPrice').value;
    const maxPrice = document.getElementById('maxPrice').value;

    if (minPrice && maxPrice && parseFloat(minPrice) > parseFloat(maxPrice)) {
        alert('最低价不能大于最高价');
        return;
    }

    currentPriceMin = minPrice || null;
    currentPriceMax = maxPrice || null;

    let productsToFilter;
    if (currentSearchKeyword) {
        productsToFilter = allProductsCache;
    } else {
        productsToFilter = allProductsCache;
    }

    const filteredProducts = applyCurrentPriceFilter(productsToFilter);
    updateProductList(filteredProducts);

}

        async function sendMessage() {
            if (isSending) return;
            
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg && !selectedChatImage) return;

            isSending = true;
            input.disabled = true;

            const chatContainer = document.getElementById('chatMessages');
            
            const userDiv = document.createElement('div');
            userDiv.className = 'flex flex-col space-y-2';
            
            let userContent = '';
            if (selectedChatImage) {
                const imageUrl = URL.createObjectURL(selectedChatImage);
                userContent += `<img src="${imageUrl}" class="max-w-xs rounded mb-2">`;
            }
            if (msg) {
                userContent += `<div class="message-bubble message-user">${msg}</div>`;
            }
            userDiv.innerHTML = userContent;
            chatContainer.appendChild(userDiv);
            
            input.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Prepare request
            const formData = new FormData();
            formData.append('conversationId', conversationId || 'guest');
            formData.append('message', msg || (selectedChatImage ? '[图片]' : ''));
            if (selectedChatImage) {
                formData.append('image', selectedChatImage);
            }

            // Clear image after sending
            clearChatImage();

            const aiDiv = document.createElement('div');
            aiDiv.className = 'flex flex-col space-y-2';
            const loadingHtml = `
                <div class="message-bubble message-ai flex items-center space-x-2">
                    <span class="mr-2">请稍候</span>
                    <div class="flex space-x-1">
                        <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce"></div>
                        <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                        <div class="w-1.5 h-1.5 bg-gray-500 rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
                    </div>
                </div>`;
            aiDiv.innerHTML = loadingHtml;
            chatContainer.appendChild(aiDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetchWithAuth('/ai/chat', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('请求失败');
                
                const text = await response.text();

                // Replace loading bubble with actual reply container
                aiDiv.innerHTML = `<div class="message-bubble message-ai"></div>`;
                const contentDiv = aiDiv.querySelector('.message-bubble');
                
                let index = 0;
                const timer = setInterval(() => {
                    if (index < text.length) {
                        contentDiv.innerText += text.charAt(index);
                        index++;
                        chatContainer.scrollTop = chatContainer.scrollHeight;
                    } else {
                        clearInterval(timer);
                    }
                }, 20);
                
            } catch (e) {
                console.error("AI 回复出错:", e);
                aiDiv.innerHTML = `<div class="message-bubble message-ai text-red-500">发送失败，请重试</div>`;
            } finally {
                isSending = false;
                input.disabled = false;
                input.focus();
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

async function checkUnreadMessages(fromUserId, currentUserId) {
    if (!currentUserId) {
        console.warn('Invalid parameters for checkUnreadMessages');
        updateUnreadBadge(0);
        return;
    }
    if (!fromUserId) {
        try {
            const response = await fetchWithAuth(`/api/messages/unread/count?userId=${encodeURIComponent(currentUserId)}`);
            if (response.ok) {
                const unreadCount = await response.json();
                updateUnreadBadge(unreadCount);
            } else {
                console.error('查询未读消息数量失败:', response.status);
                updateUnreadBadge(0);
            }
        } catch (error) {
            console.error('请求出错:', error);
            updateUnreadBadge(0);
        }
        return;
    }


    try {
        const response = await fetchWithAuth(`/api/messages/unread?from=${encodeURIComponent(fromUserId)}&currentId=${encodeURIComponent(currentUserId)}`, {
            method: 'GET'
        });

        if (response.ok) {
            const hasUnread = await response.json();
            updateUnreadBadge(hasUnread);
        } else {
            console.error('查询未读消息失败:', response.status);
            updateUnreadBadge(0);
        }
    } catch (error) {
        console.error('请求出错:', error);
        updateUnreadBadge(0);
    }
}

}
     async function connectSSE(userId) {
         if (eventSource) {
             eventSource.close();
         }
        const encodedUserId = encodeURIComponent(userId);
        eventSource = new EventSource(`/sse/connect/${encodedUserId}`);

        const handleSseMessage = async function(event) {
            const message = event.data;
            if (message === "收到新消息" || message.startsWith("new_message:")) {
                if (message.startsWith("new_message:")) {
                    const senderId = message.split(":")[1];
                    if (currentChatTargetId === senderId) {
                        await loadUserChatHistory();
                        const messages = document.querySelectorAll('#userChatMessages .message-bubble');
                    }
                }

                const response = await fetchWithAuth(`/api/messages/unread/count?userId=${encodeURIComponent(currentUser.userId)}`);
                if (response.ok) {
                    const unreadCount = await response.json();
                    updateUnreadBadge(unreadCount);
                } else {
                    console.error('查询未读消息数量失败:', response.status);
                }
            }
        };
         eventSource.onmessage = handleSseMessage;
         eventSource.addEventListener('message', handleSseMessage);

         eventSource.onerror = function(err) {
             console.error("SSE 连接出错:", err);
             eventSource.close();
         };
     }

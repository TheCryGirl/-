# #44 验证用端口覆盖：宿主已有 Nacos(8848)/MySQL(3306)/六服务(9000~9005)，
# 为避免冲突，容器映射到 1xxxx 段。容器之间仍用容器名+原端口通信，不受影响。
services:
  nacos:
    ports: !override
      - "127.0.0.1:18848:8848"
      - "127.0.0.1:19848:9848"

  mysql:
    ports: !override
      - "127.0.0.1:13306:3306"

  gateway:
    ports: !override
      - "127.0.0.1:19000:9000"

  user-service:
    ports: !override []

  product-service:
    ports: !override []

  cart-service:
    ports: !override []

  order-service:
    ports: !override []

  payment-service:
    ports: !override []

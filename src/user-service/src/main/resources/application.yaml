server:
  port: 9001

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/mall_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        enabled: ${NACOS_ENABLED:true}
        # 开发期 Nacos 未就绪时不阻塞启动，方便单服务调试
        fail-fast: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

  jackson:
    time-zone: Asia/Shanghai

  servlet:
    multipart:
      # 头像上传：与 AvatarStorageService 的 5MB 校验保持一致
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.user.entity
  configuration:
    map-underscore-to-camel-case: true

user:
  # 头像目录，访问路径为 /avatars/**，与商品图片一致（契约 9.4）
  upload-dir: ${USER_UPLOAD_DIR:uploads}
  # 调 product-service 内部接口时携带的令牌
  internal-token: ${INTERNAL_TOKEN:}

services:
  # 收藏夹 / 足迹需要商品标题与价格；店铺停用需要同步商品可见性
  product-url: ${PRODUCT_SERVICE_URL:}

# JWT 签名密钥：必须从环境变量读取，禁止在配置里写死。
# 未设置时留空，JwtUtil 会直接启动失败，避免带着弱默认密钥上线。
# 本地开发用 src/scripts/dev.ps1 启动会自动注入开发密钥。
jwt:
  secret: ${JWT_SECRET:}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}

# 初始管理员引导：注册接口只创建 BUYER，管理端需要 ADMIN 才能使用。
# 仅在配置了账号与口令时生效；未配置则跳过，不会写入任何默认口令。
admin:
  bootstrap:
    account: ${ADMIN_BOOTSTRAP_ACCOUNT:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mall.user: debug

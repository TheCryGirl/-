server:
  port: 9002

spring:
  application:
    name: product-service

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/mall_product?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 3000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      encoding: UTF-8

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        enabled: ${NACOS_ENABLED:true}
        fail-fast: false

  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

  servlet:
    multipart:
      # 商品图片上传：与 ProductService 的 5MB 校验保持一致
      max-file-size: 5MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.product.entity
  configuration:
    map-underscore-to-camel-case: true

product:
  upload-dir: ${PRODUCT_UPLOAD_DIR:uploads}
  internal-token: ${INTERNAL_TOKEN:}
  reservation:
    scan-interval-ms: 60000

services:
  # 审核与卖家上架前查店铺营业状态（#49）
  user-url: ${USER_SERVICE_URL:}
  # 操作审计上报到 order-service（#58）
  order-url: ${ORDER_SERVICE_URL:}

# 操作审计上报开关（#58）；审计中心不可用时只记 warn，不影响业务
audit:
  enabled: ${AUDIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mall.product: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%X{traceId:-}] [%15.15thread] %-40.40logger{39} : %msg%n"

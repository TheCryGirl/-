server:
  port: 9000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        # 开发期 Nacos 未就绪时不阻塞启动，方便单独调试网关。
        # 生产环境改为 true，避免服务"假启动"却没注册成功。
        fail-fast: false
    gateway:
      # 关闭默认跨域，统一由 CorsConfig 处理，避免响应头重复
      globalcors:
        add-to-simple-url-handler-mapping: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**
          filters:
            # 契约 1.2：下游服务路径不带 /api 前缀
            - StripPrefix=1
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - StripPrefix=1
        - id: product-images
          uri: lb://product-service
          predicates:
            - Path=/images/**
          # 静态图片路径与 product-service 一致，不加 StripPrefix
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
        - id: platform-config
          uri: lb://order-service
          predicates:
            - Path=/api/config/**
          filters:
            - StripPrefix=1
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1

  # 下游服务超时控制，防止一个服务卡住拖垮整个网关
  http:
    connect-timeout: 2000
    read-timeout: 6000

jwt:
  # 与各服务保持一致，从环境变量读，不在配置里写死；未设置时网关启动失败
  secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mall.gateway: debug
    org.springframework.cloud.gateway: info
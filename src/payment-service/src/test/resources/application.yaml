spring:
  application:
    name: payment-service

  datasource:
    url: jdbc:h2:mem:mall_payment;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      encoding: UTF-8

  cloud:
    nacos:
      discovery:
        enabled: false
        fail-fast: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.payment.entity
  configuration:
    map-underscore-to-camel-case: true

payment:
  mock-secret: test-mock-secret
  internal-token: test-internal-token

services:
  order-url: http://127.0.0.1:1
  product-url: http://127.0.0.1:1

logging:
  level:
    com.mall.payment: info

<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- 首页与页面顶部的浅色网格纹理：低对比度，只为给大面积留白一点层次 -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#e1251b" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#e1251b" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" fill="url(#grid)"/>
  <rect width="160" height="160" fill="url(#fade)"/>
</svg>
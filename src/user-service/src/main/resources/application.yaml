server:
  port: 9001

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/mall_user?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        enabled: ${NACOS_ENABLED:true}
        # 开发期 Nacos 未就绪时不阻塞启动，方便单服务调试
        fail-fast: false
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.mall.user.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 签名密钥：必须从环境变量读取，禁止在配置里写死生产密钥
jwt:
  secret: ${JWT_SECRET:dev-only-secret-please-change-in-production-0123456789}
  expiration-hours: ${JWT_EXPIRATION_HOURS:168}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.mall.user: debug
